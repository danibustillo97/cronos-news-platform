name: Discovery Processing

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cronos-discovery-processing
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - name: Run queued discovery jobs (botón Buscar)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SCRAPER_SOURCES: ${{ secrets.SCRAPER_SOURCES }}
          SCRAPER_MAX_AGE_HOURS: ${{ vars.SCRAPER_MAX_AGE_HOURS }}
          SCRAPER_MAX_ITEMS_PER_SOURCE: ${{ vars.SCRAPER_MAX_ITEMS_PER_SOURCE }}
          SCRAPER_MAX_NEW_ITEMS: ${{ vars.SCRAPER_MAX_NEW_ITEMS }}
          SCRAPER_FETCH_FULL_TEXT: ${{ vars.SCRAPER_FETCH_FULL_TEXT }}
        run: python automation/run_discovery_jobs.py
