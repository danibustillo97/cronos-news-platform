# NEXUS reverse proxy — the single public entry point in front of the
# services that already run natively on the host (backend: uvicorn on
# :8000, frontend: Next.js dev server on :3000, Local Runtime: uvicorn on
# :8801). Nginx is the ONLY thing that runs in Docker here, on purpose —
# see infrastructure/docker/docker-compose.yml for why the dev servers
# themselves stay native instead of being containerized too.
#
# host.docker.internal is Docker Desktop's built-in DNS name for "the
# Windows host machine" — it's how a container reaches a process that
# isn't in Docker at all.

events {
    worker_connections 1024;
}

http {
    # No explicit limit here before meant nginx's own default (1MB) was
    # silently rejecting real editorial image uploads (POST .../upload)
    # before the request ever reached the backend -- the backend's own
    # 10MB cap (see app/presentation/api/artifacts.py::_MAX_UPLOAD_BYTES)
    # never even got a chance to run. 20M is a real, deliberately-generous
    # ceiling above that 10MB backend limit: nginx's job here is "don't
    # reject a legitimate photo before the app can give a clean error",
    # not to be the source of truth for what's an acceptable image size.
    client_max_body_size 20M;

    upstream backend {
        server host.docker.internal:8000;
    }

    upstream frontend {
        server host.docker.internal:3000;
    }

    upstream runtime {
        server host.docker.internal:8801;
    }

    server {
        listen 80;
        server_name nexus.local localhost;

        # Real backend health check, passed straight through — nginx never
        # answers this itself, so a 200 here means the backend is actually up.
        location /health {
            proxy_pass http://backend/health;
        }

        # Next.js has its OWN real API routes under /api/ too
        # (frontend/src/app/api/{proxy-image,tts,tiktok/*,news,import-article})
        # -- the blanket /api/ rule below sends everything to FastAPI, which
        # has no matching route for these and answers its own 404, silently
        # breaking them (found via: every image on the site going black --
        # /api/proxy-image is what every <Image> on both the public portal
        # and NEXUS Studio's canvas preview goes through, see
        # frontend/src/lib/media.ts). These `location` blocks are more
        # specific prefixes than /api/, so nginx matches them first
        # regardless of file order -- listed above /api/ anyway for a human
        # reading top-to-bottom.
        location /api/proxy-image {
            proxy_pass http://frontend/api/proxy-image;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/tts {
            proxy_pass http://frontend/api/tts;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/tiktok/ {
            proxy_pass http://frontend/api/tiktok/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/news {
            proxy_pass http://frontend/api/news;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/import-article {
            proxy_pass http://frontend/api/import-article;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/ {
            proxy_pass http://backend/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # The Local Runtime (automation/runtime/) — not part of the public
        # product surface, but proxied for nexus doctor / debugging without
        # needing to remember port 8801.
        location /runtime/ {
            proxy_pass http://runtime/;
            proxy_set_header Host $host;
        }

        # "Studio" isn't a separate route today -- it's a tab inside the
        # admin Command Center (frontend/src/app/admin/page.tsx), not its
        # own Next.js page. Proxying to /admin is the honest mapping: it's
        # where Studio actually lives, not a fabricated route.
        location /studio {
            proxy_pass http://frontend/admin;
            proxy_set_header Host $host;
        }

        # Everything else: the public site + /admin itself + Next.js's own
        # dev assets (_next/, HMR websocket) — needs the Upgrade headers or
        # hot reload breaks.
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
